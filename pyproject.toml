[project]
name = "market-intel"
version = "0.1.0"
description = "Normalised market intelligence (SEC EDGAR + optional Yahoo Finance) as a Python library and HTTP API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "diskcache>=5.6",
    "pandas>=2.2",
    # Optional at runtime: only imported when MI_YAHOO_ENABLED=true.
    "yfinance>=0.2.50",
]

[project.scripts]
mi = "market_intel.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_intel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
